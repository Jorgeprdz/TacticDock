name: Tactic Dock R1.4.3 - Verified APK
on:
  push:
    branches: [feat/tactic-dock-r1-floating]
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Tests and APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Create signed-by-checksum delivery
        run: |
          mkdir -p deliver
          cp app/build/outputs/apk/debug/app-debug.apk deliver/TacticDock-R1.4.3.apk
          cp scripts/TacticDock-R1.4.3-Install.sh deliver/TacticDock-R1.4.3-Install.sh
          cd deliver
          sha256sum TacticDock-R1.4.3.apk > TacticDock-R1.4.3.apk.sha256
          cat TacticDock-R1.4.3.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TacticDock-R1.4.3-APK
          path: deliver/
          if-no-files-found: error
          retention-days: 14
