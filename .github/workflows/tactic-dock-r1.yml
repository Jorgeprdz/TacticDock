name: Tactic Dock R1 - APK
on:
  push:
    branches: [feat/tactic-dock-r1-floating]
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: SHA256
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TacticDock-R1-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
